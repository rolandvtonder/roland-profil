            "@type": "Question",
            "name": "Can a small guesthouse really get direct bookings?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, and it is usually the single most profitable change a small place can make. Booking platforms charge a commission on every night. A guest who books direct the second time has paid for the website several times over."
            }
          },
          {
            "@type": "Question",
            "name": "Should I still list on Booking.com and Airbnb?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Almost certainly, because that is where new guests find you. The aim is not to leave the platforms, it is to own the guests they introduce you to — so returning visitors and anyone who searches your name books direct."
            }
          },

            "@type": "Question",
            "name": "Can you add live availability and online payment?",

              "@type": "Answer",
