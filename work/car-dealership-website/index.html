            "name": "Do you build websites for car dealerships?",

              "@type": "Answer",
              "text": "Yes. Karam Motors in Fourways is a live example. A dealership site has specific work to do: list stock with proper photography and prices, answer the finance question, and take trade-in enquiries in a form that is actually useful to the dealer."
            }
          },
          {
            "@type": "Question",
            "name": "Can the site handle stock that changes every week?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Cars come and go, so adding, editing and removing stock has to be quick and must not need a developer every time. That gets set up as part of the build."
            }
          },
          {
            "@type": "Question",
            "name": "Should a dealership show prices online?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In almost every case, yes. Hiding the price to force an enquiry wins the handful of people who call and loses everyone who is comparing. A buyer who has seen the price and worked out the instalment is a far warmer lead than one who had to ask."
            }
          },
          {
            "@type": "Question",
            "name": "What does a dealership website cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It depends on how many cars you carry and whether you need finance tools and trade-in forms. You get a fixed quote upfront, and a free homepage design first so you can see it before deciding."
            }
