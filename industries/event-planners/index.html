            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Event businesses have a specific need: a gallery that carries the sale, pricing people can act on, and an enquiry that captures the date before anything else. The Flexi Hire concept in my portfolio is built around exactly that."

            "@type": "Question",
            "name": "Can the website show my availability?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It can, though for most event businesses a date-first enquiry works better than a live calendar, because availability usually depends on the size of the job as well as the date."
            }
          },
          {
            "@type": "Question",
            "name": "I have hundreds of event photos. Will that slow the site down?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not if they are handled properly. Images get compressed and loaded only as someone scrolls to them, so a large gallery still opens fast on a phone."
            }
          },
          {
            "@type": "Question",
            "name": "Should I show prices for events?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A starting price, yes. Event clients are comparing several suppliers at once, and the ones who hide pricing get skipped by people who had the budget anyway."
