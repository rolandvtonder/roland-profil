      {

          {
            "@type": "Question",
            "name": "Do you build websites for guest houses and B&Bs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Bokkoms, a self-catering guesthouse in Paternoster, is a live client, and there is a full case study of that build in my portfolio."

          {
            "@type": "Question",
            "name": "Should I leave Booking.com and Airbnb?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. They are how new guests find you, and that is worth paying for. The aim is to own the guests they introduce you to, so that returning visitors and anyone who searches your name books direct instead."
            }
          },
          {
            "@type": "Question",
            "name": "Can the site show live availability?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. How it works depends on how you manage your calendar now, and whether you want to take a deposit or full payment at the time of booking. We work that out before anything is built."
            }
          },
          {
            "@type": "Question",
            "name": "I only have a few rooms. Is a website worth it?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Usually yes, and the smaller you are the more the commission hurts. Work out what you paid in platform fees last year. For most small places, a website pays for itself within a season."
            }
          },
          {
            "@type": "Question",
            "name": "What about Google? Nobody searches my guesthouse by name.",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Some do, especially returning guests and people given your name by a friend, and those are exactly the bookings you want direct. Beyond that, a Google Business Profile puts you on the map for people searching your town, and I set that up as part of the job."
            }
          }
