    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do you build websites for car dealerships?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Karam Motors in Fourways, a family dealership trading since 1980, is a live client, and there is a full case study of that build in my portfolio."
            }
          },
          {
            "@type": "Question",
            "name": "Should I still list on AutoTrader and Cars.co.za?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. That is where most buyers start, and it is worth paying for. The aim is not to leave them, it is to own what happens next — so the buyer who searches your name, or clicks through from a listing, lands somewhere that sells you rather than just the car."
            }
          },
          {
            "@type": "Question",
            "name": "How does stock get updated when cars sell?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Adding, editing and removing cars has to be quick and must not need a developer every time. How we set it up depends on how many cars you carry and how fast they move, and we work that out before building."
            }
          },
          {
            "@type": "Question",
            "name": "Should I show prices on my website?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In almost every case, yes. Hiding the price to force a phone call wins the few who call and loses everyone who was comparing. A buyer who has seen the price and worked out their instalment is a far warmer lead than one who had to ask."
            }
          },
          {
            "@type": "Question",
            "name": "Can the site handle finance applications?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — your lenders, the document checklist and an application that arrives with enough detail to act on. It can include a repayment estimator so buyers answer the affordability question themselves."
            }
          },
          {
            "@type": "Question",
            "name": "What does a dealership website cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It depends on how many cars you carry and whether you need finance tools and trade-in forms. You get a fixed quote upfront, and the homepage design is free either way."
            }
          }
        ]
      }
