    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How much should I spend on Facebook ads?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Two separate numbers: the ad budget, which goes to Meta, and the management fee, which comes to me. For a small local business a meaningful test budget usually starts around R3 000 to R5 000 a month. Below that there is not enough data to learn from, and you end up paying to guess."
            }
          },
          {
            "@type": "Question",
            "name": "Why not just boost posts myself?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can, and for building a following it is fine. But boosting gives you almost no control over targeting, no proper conversion tracking and no way to test versions against each other. If the goal is enquiries rather than likes, it is the wrong tool."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need a website before running ads?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "For anything beyond brand awareness, yes. Sending paid traffic to a Facebook page or a weak page is how advertising budgets disappear. If you do not have a site yet, that comes first, and I build those too."
            }
          },
          {
            "@type": "Question",
            "name": "How soon will I see results?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The first two to four weeks are mostly learning, which feels slow and is not wasted. Meta needs conversion data before it can find more of the right people. Anyone promising returns in week one is guessing."
            }
          },
          {
            "@type": "Question",
            "name": "Can you do Google Ads as well?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, and often it is the better fit. Meta is for demand you create; Google is for demand that already exists. A plumber wants Google, because people search when the pipe bursts. An event venue wants Meta, because nobody searches for a venue they have not imagined yet."
            }
          },
          {
            "@type": "Question",
            "name": "Who owns the ad account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You do. The Business Manager, the pixel data and the audiences stay in your account, so if we stop working together you keep everything that was built."
            }
          }
        ]
      }
